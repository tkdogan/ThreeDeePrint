name: Go2Bed
version: 1.2.0
authors:
  - Timur Dogan
description: Turn BIM and solid models into printable, buildable model kits in Rhino and Grasshopper. Checks the input, trims overlaps, adds joints and pins, packs parts onto your printer's bed and exports 3MF projects for any slicer, or STL. Rhino 7, 8 and 9 on Windows and Mac.
url: https://github.com/tkdogan/ThreeDeePrint
